<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1a24">
<meta name="application-name" content="Волейбол Розстановка">
<meta name="author" content="zavalnyuk">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Волейбол Розстановка</title>
<style>
:root {
  /* Одна візуальна тема: нічний спортзал. Корт знизу, керування пальцем великого розміру. */
  --bg: #0e1a24;
  --panel: #16273a;
  --line: #2a405a;
  --text: #eaf1f8;
  --muted: #93a8bd;
  --accent: #ffb703;
  --floor: #2f7f6d;
  --out: #12212f;
  --ok: #5fd39a;
  --bad: #ff7a7a;
  --font-display: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
body { -webkit-tap-highlight-color: transparent; }
.app { max-width: 520px; margin: 0 auto; padding: 14px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 { font-family: var(--font-display); font-size: 17px; letter-spacing: .02em; margin: 0; font-weight: 700; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; }
button {
  font: inherit; color: var(--text); background: transparent; border: 0; border-radius: 9px;
  min-height: 44px; padding: 0 14px; font-weight: 600; font-size: 15px; cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg button[aria-pressed="true"], .seg button.on { background: var(--accent); color: #1a1300; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  background: var(--panel); border: 1px solid var(--line); min-height: 44px; border-radius: 12px; padding: 0 14px;
}
.chip[aria-pressed="true"] { background: var(--text); color: #0e1a24; border-color: var(--text); }
.chip.rot { min-width: 48px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; flex: 1 1 0; }
.chip.rot b { font-size: 18px; font-variant-numeric: tabular-nums; }
.chip.rot small { font-size: 10px; font-weight: 500; opacity: .75; white-space: nowrap; }
h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.court-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; position: relative; }
svg#court { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.tok { transition: transform .9s cubic-bezier(.45, .05, .2, 1); cursor: default; }
.tok.drag { transition: none; }
.edit .tok { cursor: grab; }
.tok text { font-family: var(--font-body); font-weight: 700; font-size: 4.3px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.zn { font-family: var(--font-display); font-size: 5px; fill: #fff; opacity: .28; text-anchor: middle; pointer-events: none; }
.note { font-size: 14px; line-height: 1.45; color: var(--text); margin: 0; max-width: 62ch; }
.check { font-size: 13px; margin: 0; font-weight: 600; min-height: 20px; }
.check.ok { color: var(--ok); }
.check.bad { color: var(--bad); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.actions button.on { background: var(--accent); color: #1a1300; border-color: var(--accent); }
.actions button[disabled] { opacity: .45; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; display: inline-block; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
summary { cursor: pointer; font-weight: 600; min-height: 24px; }
.legend { display: grid; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 10px; }
.dev { text-align: center; color: var(--muted); font-size: 13px; padding-top: 6px; }
.dev b { color: var(--text); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .tok { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Волейбол <span>розстановка</span></h1>
    <div class="sub" id="status">5-1 · ротація 1</div>
  </header>

  <div class="row">
    <div class="seg grow" id="sysSeg" role="group" aria-label="Система гри">
      <button type="button" data-sys="5-1" aria-pressed="true">5-1</button>
      <button type="button" data-sys="4-2" aria-pressed="false">4-2</button>
    </div>
    <div class="seg" role="group" aria-label="Ліберо">
      <button type="button" id="libBtn" aria-pressed="false">Ліберо</button>
    </div>
  </div>

  <div class="court-wrap" id="courtWrap">
    <svg id="court" viewBox="-10 -14 120 138" role="img" aria-label="Волейбольний майданчик, наша половина"></svg>
  </div>

  <section>
    <h2>Ротація · де стоїть зв’язуючий</h2>
    <div class="chips" id="rotChips"></div>
  </section>

  <section>
    <h2>Хто починає розіграш</h2>
    <div class="seg" id="srvSeg" role="group" aria-label="Подача чи прийом">
      <button type="button" data-srv="1" aria-pressed="true">Ми подаємо</button>
      <button type="button" data-srv="0" aria-pressed="false">Ми приймаємо</button>
    </div>
  </section>

  <section>
    <h2>Фаза</h2>
    <div class="chips" id="phaseChips"></div>
  </section>

  <p class="note" id="desc"></p>
  <p class="check" id="check" aria-live="polite"></p>

  <div class="actions">
    <button type="button" id="autoBtn">▶ Авторух</button>
    <button type="button" id="nextBtn">Наступна ротація ↻</button>
    <button type="button" id="editBtn">Редагувати позиції</button>
    <button type="button" id="resetBtn">Скинути мої зміни</button>
  </div>

  <details>
    <summary>Умовні позначення</summary>
    <div class="legend" id="legend"></div>
  </details>

  <footer class="dev">Розробник: <b>zavalnyuk</b></footer>
</div>

<script>
(function (root) {
  'use strict';

  // Координати: х 0..100 (зліва направо, дивимось з-за лицьової лінії), y 0..100 (0 = сітка, 100 = лицьова лінія).
  const FRONT = [4, 3, 2];
  const BACK = [5, 6, 1];

  const ZONE_BASE = {
    4: [17, 17], 3: [50, 17], 2: [83, 17],
    5: [17, 68], 6: [50, 68], 1: [83, 68]
  };

  // Порядок гравців по зонах 1,2,3,4,5,6 у першій ротації.
  const SYSTEMS = {
    '5-1': [
      { id: 'S', type: 'S', label: 'Зв', name: 'Зв’язуючий' },
      { id: 'H1', type: 'H', label: 'Дг1', name: 'Догравальник 1' },
      { id: 'M2', type: 'M', label: 'ЦБ2', name: 'Центральний 2' },
      { id: 'O', type: 'O', label: 'Діаг', name: 'Діагональний' },
      { id: 'H2', type: 'H', label: 'Дг2', name: 'Догравальник 2' },
      { id: 'M1', type: 'M', label: 'ЦБ1', name: 'Центральний 1' }
    ],
    '4-2': [
      { id: 'S1', type: 'S', label: 'Зв1', name: 'Зв’язуючий 1' },
      { id: 'H1', type: 'H', label: 'Дг1', name: 'Догравальник 1' },
      { id: 'M1', type: 'M', label: 'ЦБ1', name: 'Центральний 1' },
      { id: 'S2', type: 'S', label: 'Зв2', name: 'Зв’язуючий 2' },
      { id: 'H2', type: 'H', label: 'Дг2', name: 'Догравальник 2' },
      { id: 'M2', type: 'M', label: 'ЦБ2', name: 'Центральний 2' }
    ]
  };

  // Подача: подаючий за лицьовою лінією, решта на своїх зонах.
  const SERVE = {
    1: [86, 113], 2: [82, 12], 3: [50, 12], 4: [18, 12], 5: [16, 62], 6: [50, 64]
  };

  // Прийом подачі. Ключ: зона, де стоїть активний зв'язуючий.
  const RECEIVE = {
    1: { 1: [92, 40], 2: [76, 16], 3: [50, 12], 4: [22, 36], 5: [12, 64], 6: [50, 76] },
    2: { 1: [86, 62], 2: [88, 10], 3: [50, 14], 4: [22, 36], 5: [12, 64], 6: [50, 76] },
    3: { 1: [86, 64], 2: [90, 30], 3: [66, 10], 4: [22, 36], 5: [12, 64], 6: [50, 76] },
    4: { 1: [86, 64], 2: [90, 32], 3: [64, 10], 4: [44, 10], 5: [12, 64], 6: [44, 76] },
    5: { 1: [88, 62], 2: [80, 32], 3: [48, 12], 4: [12, 26], 5: [22, 46], 6: [56, 76] },
    6: { 1: [88, 62], 2: [80, 30], 3: [46, 12], 4: [18, 30], 5: [14, 66], 6: [58, 42] }
  };

  // Захист: ліва = атакують нашу ліву сторону (зона 4), права = зона 2.
  const DEF = {
    defL: { 4: [16, 6], 3: [36, 6], 2: [72, 24], 5: [10, 58], 6: [42, 76], 1: [76, 66] },
    defC: { 4: [22, 24], 3: [50, 6], 2: [78, 24], 5: [18, 62], 6: [50, 78], 1: [82, 62] },
    defR: { 2: [84, 6], 3: [64, 6], 4: [28, 24], 1: [90, 58], 6: [58, 76], 5: [24, 66] }
  };

  const PHASES = ['start', 'serve', 'receive', 'attack', 'defL', 'defC', 'defR'];

  function zoneOf(idx, rot) {
    return ((idx - rot + 6) % 6) + 1;
  }

  function isFront(z) { return FRONT.indexOf(z) >= 0; }

  function activeSetterId(system, rot) {
    const base = SYSTEMS[system];
    if (system === '5-1') return 'S';
    for (let i = 0; i < 6; i++) {
      if (base[i].type === 'S' && isFront(zoneOf(i, rot))) return base[i].id;
    }
    return null;
  }

  function activeSetterZone(system, rot) {
    const id = activeSetterId(system, rot);
    const base = SYSTEMS[system];
    for (let i = 0; i < 6; i++) if (base[i].id === id) return zoneOf(i, rot);
    return null;
  }

  // Гравці у вибраній ротації з урахуванням ліберо.
  function players(system, rot, phase, serving, libero) {
    const base = SYSTEMS[system];
    const act = activeSetterId(system, rot);
    return base.map(function (b, i) {
      const zone = zoneOf(i, rot);
      const p = {
        id: b.id, type: b.type, label: b.label, name: b.name,
        zone: zone, front: isFront(zone), active: b.id === act
      };
      if (libero && b.type === 'M' && !p.front) {
        const server = serving && (phase === 'start' || phase === 'serve') && zone === 1;
        if (!server) { p.type = 'L'; p.label = 'Л'; p.name = 'Ліберо'; }
      }
      return p;
    });
  }

  function attackPos(p) {
    if (p.front) {
      if (p.type === 'S') return [74, 8];
      if (p.type === 'H') return [14, 8];
      if (p.type === 'M') return [46, 8];
      if (p.type === 'O') return [90, 8];
    } else {
      if (p.type === 'S') return p.active ? [72, 10] : [70, 66];
      if (p.type === 'H') return [26, 44];
      if (p.type === 'O') return [82, 44];
      if (p.type === 'M' || p.type === 'L') return [50, 74];
    }
    return [50, 50];
  }

  function positions(system, rot, phase, serving, libero) {
    const ps = players(system, rot, phase, serving, libero);
    const pos = {};
    if (phase === 'start') {
      ps.forEach(function (p) { pos[p.id] = ZONE_BASE[p.zone].slice(); });
    } else if (phase === 'serve') {
      ps.forEach(function (p) { pos[p.id] = SERVE[p.zone].slice(); });
    } else if (phase === 'receive') {
      const T = RECEIVE[activeSetterZone(system, rot)];
      ps.forEach(function (p) { pos[p.id] = T[p.zone].slice(); });
    } else if (phase === 'attack') {
      ps.forEach(function (p) { pos[p.id] = attackPos(p); });
    } else {
      const T = DEF[phase];
      ps.forEach(function (p) { pos[p.id] = T[p.zone].slice(); });
    }
    return pos;
  }

  // Правило перекриття діє в момент подачі.
  function violations(ps, pos) {
    const z = {};
    ps.forEach(function (p) { z[p.zone] = pos[p.id]; });
    const out = [];
    function left(a, b) {
      if (!(z[a][0] < z[b][0])) out.push('Зона ' + a + ' має стояти лівіше за зону ' + b + '.');
    }
    function nearer(a, b) {
      if (!(z[a][1] < z[b][1])) out.push('Зона ' + a + ' має стояти ближче до сітки, ніж зона ' + b + '.');
    }
    left(4, 3); left(3, 2); left(5, 6); left(6, 1);
    nearer(4, 5); nearer(3, 6); nearer(2, 1);
    return out;
  }

  const api = {
    FRONT: FRONT, BACK: BACK, ZONE_BASE: ZONE_BASE, SYSTEMS: SYSTEMS, PHASES: PHASES,
    zoneOf: zoneOf, activeSetterId: activeSetterId, activeSetterZone: activeSetterZone,
    players: players, positions: positions, violations: violations
  };
  root.VB = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  var VB = window.VB;
  var NS = 'http://www.w3.org/2000/svg';
  var COLORS = {
    S: { fill: '#ffd23f', text: '#2a1f00' },
    O: { fill: '#8e6bff', text: '#ffffff' },
    H: { fill: '#ef476f', text: '#ffffff' },
    M: { fill: '#2f7bff', text: '#ffffff' },
    L: { fill: '#f1f5f9', text: '#0e1a24' }
  };
  var PHASE_NAMES = {
    start: 'Стартова', serve: 'Подача', receive: 'Прийом', attack: 'Атака',
    defL: 'Захист ліва', defC: 'Захист центр', defR: 'Захист права'
  };
  var LEGEND = [
    ['S', 'Зв — зв’язуючий. Розподіляє другий пас.'],
    ['O', 'Діаг — діагональний. Грає навпроти зв’язуючого, атакує з правого краю.'],
    ['H', 'Дг — догравальник. Приймає подачу і атакує з лівого краю.'],
    ['M', 'ЦБ — центральний блокуючий. Блок і швидка атака по центру.'],
    ['L', 'Л — ліберо. Грає лише в задній лінії замість центрального.']
  ];

  var state = { sys: '5-1', rot: 0, serving: true, phase: 'start', libero: false, edit: false, auto: null };
  var overrides = {};
  try { overrides = JSON.parse(localStorage.getItem('vb-overrides') || '{}') || {}; } catch (e) { overrides = {}; }
  function saveOverrides() { try { localStorage.setItem('vb-overrides', JSON.stringify(overrides)); } catch (e) {} }

  var svg = document.getElementById('court');
  var tokens = {};
  var ball;

  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  function drawCourt() {
    el('rect', { x: -10, y: -14, width: 120, height: 138, fill: 'var(--out)' }, svg);
    el('rect', { x: 0, y: 0, width: 100, height: 100, fill: 'var(--floor)' }, svg);
    var ln = { stroke: '#ffffff', 'stroke-width': 0.9, fill: 'none' };
    el('rect', { x: 0, y: 0, width: 100, height: 100, stroke: '#fff', 'stroke-width': 1, fill: 'none' }, svg);
    el('line', { x1: 0, y1: 33.3, x2: 100, y2: 33.3, stroke: ln.stroke, 'stroke-width': 0.8 }, svg);
    el('line', { x1: -9, y1: 33.3, x2: 0, y2: 33.3, stroke: '#fff', 'stroke-width': 0.8, 'stroke-dasharray': '2 1.6', opacity: 0.7 }, svg);
    el('line', { x1: 100, y1: 33.3, x2: 109, y2: 33.3, stroke: '#fff', 'stroke-width': 0.8, 'stroke-dasharray': '2 1.6', opacity: 0.7 }, svg);
    // сітка
    el('line', { x1: -3, y1: -1.6, x2: 103, y2: -1.6, stroke: '#e8eef5', 'stroke-width': 1.6 }, svg);
    el('circle', { cx: -3, cy: -1.6, r: 1.8, fill: '#ff4d4d' }, svg);
    el('circle', { cx: 103, cy: -1.6, r: 1.8, fill: '#ff4d4d' }, svg);
    var t = el('text', { x: 50, y: -7, 'text-anchor': 'middle', fill: '#93a8bd', 'font-size': 4.2, 'letter-spacing': 2 }, svg);
    t.textContent = 'СІТКА';
    var t2 = el('text', { x: 50, y: 123, 'text-anchor': 'middle', fill: '#93a8bd', 'font-size': 3.4, 'letter-spacing': 1.2, opacity: 0.8 }, svg);
    t2.textContent = 'ЗОНА ПОДАЧІ';
    // номери зон
    var zl = { 4: [17, 30], 3: [50, 30], 2: [83, 30], 5: [17, 97], 6: [50, 97], 1: [83, 97] };
    for (var z in zl) {
      var zt = el('text', { x: zl[z][0], y: zl[z][1], 'class': 'zn' }, svg);
      zt.textContent = z;
    }
    ball = el('g', { 'class': 'tok', style: 'transform:translate(-20px,-20px)', opacity: 0 }, svg);
    el('circle', { r: 2.6, fill: '#fff', stroke: '#1b2a3a', 'stroke-width': 0.6 }, ball);
    el('path', { d: 'M-2.2 -0.4 Q0 1 2.2 -0.4 M-1.4 1.9 Q0 -0.6 1.4 1.9', stroke: '#c0392b', 'stroke-width': 0.45, fill: 'none' }, ball);
  }

  function buildTokens() {
    for (var id in tokens) svg.removeChild(tokens[id].g);
    tokens = {};
    VB.SYSTEMS[state.sys].forEach(function (b) {
      var g = el('g', { 'class': 'tok', style: 'transform:translate(50px,50px)', 'data-id': b.id }, svg);
      var c = el('circle', { r: 6.4, 'stroke-width': 1.2, stroke: '#fff' }, g);
      var t = el('text', { x: 0, y: 0.3 }, g);
      g.addEventListener('pointerdown', onDown);
      tokens[b.id] = { g: g, c: c, t: t };
    });
  }

  function key() { return state.sys + '|' + state.rot + '|' + state.phase; }

  function currentPositions() {
    var pos = VB.positions(state.sys, state.rot, state.phase, state.serving, state.libero);
    var o = overrides[key()];
    if (o) for (var id in o) if (pos[id]) pos[id] = o[id].slice();
    return pos;
  }

  function place(g, x, y) { g.style.transform = 'translate(' + x + 'px,' + y + 'px)'; }

  function render() {
    var ps = VB.players(state.sys, state.rot, state.phase, state.serving, state.libero);
    var pos = currentPositions();
    ps.forEach(function (p) {
      var tk = tokens[p.id];
      if (!tk) return;
      var col = COLORS[p.type];
      tk.c.setAttribute('fill', col.fill);
      tk.t.setAttribute('fill', col.text);
      tk.t.textContent = p.label;
      place(tk.g, pos[p.id][0], pos[p.id][1]);
    });
    // м'яч біля подаючого
    var server = ps.filter(function (p) { return p.zone === 1; })[0];
    if (state.phase === 'serve' && server) {
      place(ball, pos[server.id][0] + 5.5, pos[server.id][1] - 5);
      ball.setAttribute('opacity', 1);
    } else {
      ball.setAttribute('opacity', 0);
    }
    renderControls(ps, pos);
  }

  function phaseList() {
    return ['start', state.serving ? 'serve' : 'receive', 'attack', 'defL', 'defC', 'defR'];
  }

  function renderControls(ps, pos) {
    var sz = VB.activeSetterZone(state.sys, state.rot);
    document.getElementById('status').textContent = state.sys + ' · ротація ' + (state.rot + 1);

    var rc = document.getElementById('rotChips');
    if (!rc.children.length) {
      for (var i = 0; i < 6; i++) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip rot'; b.dataset.rot = i;
        b.innerHTML = '<b>' + (i + 1) + '</b><small></small>';
        rc.appendChild(b);
      }
    }
    Array.prototype.forEach.call(rc.children, function (b, i) {
      b.setAttribute('aria-pressed', i === state.rot ? 'true' : 'false');
      b.querySelector('small').textContent = 'зона ' + VB.activeSetterZone(state.sys, i);
    });

    var pc = document.getElementById('phaseChips');
    pc.innerHTML = '';
    phaseList().forEach(function (ph) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.phase = ph;
      b.textContent = PHASE_NAMES[ph];
      b.setAttribute('aria-pressed', ph === state.phase ? 'true' : 'false');
      pc.appendChild(b);
    });

    Array.prototype.forEach.call(document.querySelectorAll('#sysSeg button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.sys === state.sys ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#srvSeg button'), function (b) {
      b.setAttribute('aria-pressed', (b.dataset.srv === '1') === state.serving ? 'true' : 'false');
    });
    document.getElementById('libBtn').setAttribute('aria-pressed', state.libero ? 'true' : 'false');

    var atZone = function (z) { return ps.filter(function (p) { return p.zone === z; })[0]; };
    var d = '';
    var sName = state.sys === '5-1' ? 'Зв’язуючий' : 'Активний зв’язуючий (у передній лінії)';
    if (state.phase === 'start') {
      d = 'Початкова розстановка в зонах. ' + sName + ' стоїть у зоні ' + sz + '. Гравці міняються по колу: зона 2 → 1 → 6 → 5 → 4 → 3 → 2.';
    } else if (state.phase === 'serve') {
      d = 'Ми подаємо. Гравець із зони 1 (' + atZone(1).label + ') подає з-за лицьової лінії, решта чекають на своїх місцях і готові до блоку та захисту.';
    } else if (state.phase === 'receive') {
      d = 'Прийом подачі. ' + sName + ' ховається ближче до правої частини сітки, щоб після прийому швидко вийти на пас. Усі стоять із дотриманням перекриття.';
    } else if (state.phase === 'attack') {
      d = 'Атака після прийому. Зв’язуючий біля сітки праворуч, догравальник атакує зліва, центральний по центру, діагональний справа. Гравці задньої лінії готові атакувати з-за 3-метрової лінії.';
    } else if (state.phase === 'defL') {
      d = 'Захист: атакують нашу ліву сторону (зона 4). Блок ставлять гравці зон 4 і 3, гравець зони 2 страхує «м’які» м’ячі, задня лінія закриває лінію, діагональ і глибину.';
    } else if (state.phase === 'defC') {
      d = 'Захист: атакують центр. Блокує гравець зони 3, гравці зон 4 і 2 відходять на 3 метри від сітки, задня лінія страхує по периметру.';
    } else {
      d = 'Захист: атакують нашу праву сторону (зона 2). Блок ставлять гравці зон 2 і 3, гравець зони 4 страхує «м’які» м’ячі, задня лінія закриває лінію, діагональ і глибину.';
    }
    if (state.edit && state.phase === 'start') d = '';
    document.getElementById('desc').textContent = d;

    var ck = document.getElementById('check');
    ck.className = 'check';
    if (state.edit && state.phase === 'start') {
      ck.className = 'check bad';
      ck.textContent = 'Стартову розстановку не редагують. Оберіть іншу фазу, щоб змінити позиції.';
    } else if (['start', 'serve', 'receive'].indexOf(state.phase) >= 0) {
      var v = VB.violations(ps, pos);
      if (!v.length) { ck.className = 'check ok'; ck.textContent = '✓ Перекриття дотримано'; }
      else { ck.className = 'check bad'; ck.textContent = 'Порушення перекриття: ' + v.join(' '); }
    } else {
      ck.textContent = 'Після подачі гравці можуть переміщуватись по майданчику вільно.';
    }

    var eb = document.getElementById('editBtn');
    eb.classList.toggle('on', state.edit);
    eb.textContent = state.edit ? 'Готово' : 'Редагувати позиції';
    document.getElementById('app').classList.toggle('edit', state.edit);
    var ab = document.getElementById('autoBtn');
    ab.classList.toggle('on', !!state.auto);
    ab.textContent = state.auto ? '❚❚ Зупинити' : '▶ Авторух';
  }

  // --- керування ---
  function stopAuto() { if (state.auto) { clearInterval(state.auto); state.auto = null; } }

  function setPhase(ph) { state.phase = ph; render(); }

  document.getElementById('sysSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    stopAuto();
    state.sys = b.dataset.sys; buildTokens(); render();
  });
  document.getElementById('srvSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.serving = b.dataset.srv === '1';
    if (state.phase === 'serve' || state.phase === 'receive') state.phase = state.serving ? 'serve' : 'receive';
    render();
  });
  document.getElementById('libBtn').addEventListener('click', function () { state.libero = !state.libero; render(); });
  document.getElementById('rotChips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.rot = +b.dataset.rot; render();
  });
  document.getElementById('phaseChips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    stopAuto(); setPhase(b.dataset.phase);
  });
  document.getElementById('nextBtn').addEventListener('click', function () { state.rot = (state.rot + 1) % 6; render(); });
  document.getElementById('autoBtn').addEventListener('click', function () {
    if (state.auto) { stopAuto(); render(); return; }
    state.edit = false;
    var list = phaseList(); var i = list.indexOf(state.phase);
    state.auto = setInterval(function () {
      var l = phaseList(); i = (l.indexOf(state.phase) + 1) % l.length;
      state.phase = l[i]; render();
    }, 2200);
    var l0 = phaseList(); state.phase = l0[(l0.indexOf(state.phase) + 1) % l0.length]; render();
  });
  document.getElementById('editBtn').addEventListener('click', function () {
    stopAuto(); state.edit = !state.edit; render();
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    delete overrides[key()]; saveOverrides(); render();
  });

  // --- перетягування ---
  var drag = null;
  function toSvg(e) {
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function onDown(e) {
    if (!state.edit || state.phase === 'start') { if (state.edit) render(); return; }
    var g = e.currentTarget; var id = g.getAttribute('data-id');
    drag = { id: id, g: g };
    g.classList.add('drag');
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }
  svg.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = toSvg(e);
    var x = Math.max(-4, Math.min(104, p.x)), y = Math.max(-4, Math.min(120, p.y));
    x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2;
    var k = key();
    overrides[k] = overrides[k] || {};
    overrides[k][drag.id] = [x, y];
    place(drag.g, x, y);
    var ps = VB.players(state.sys, state.rot, state.phase, state.serving, state.libero);
    renderControlsLight(ps);
  });
  function renderControlsLight(ps) {
    var pos = currentPositions();
    if (['serve', 'receive'].indexOf(state.phase) < 0) return;
    var ck = document.getElementById('check');
    var v = VB.violations(ps, pos);
    if (!v.length) { ck.className = 'check ok'; ck.textContent = '✓ Перекриття дотримано'; }
    else { ck.className = 'check bad'; ck.textContent = 'Порушення перекриття: ' + v.join(' '); }
  }
  function endDrag() {
    if (!drag) return;
    drag.g.classList.remove('drag'); drag = null; saveOverrides();
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  // легенда
  var lg = document.getElementById('legend');
  LEGEND.forEach(function (r) {
    var d = document.createElement('div');
    d.innerHTML = '<span class="dot" style="background:' + COLORS[r[0]].fill + '"></span><span>' + r[1] + '</span>';
    lg.appendChild(d);
  });

  drawCourt();
  buildTokens();
  render();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
    });
  }
})();
</script>
</body>
</html>
