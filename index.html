:root {
  /* Одна візуальна тема: нічний спортзал. Корт зверху, керування великими кнопками знизу. */
  --bg: #0e1a24;
  --panel: #16273a;
  --line: #2a405a;
  --text: #eaf1f8;
  --muted: #93a8bd;
  --accent: #ffb703;
  --floor: #2f7f6d;
  --out: #12212f;
  --ok: #5fd39a;
  --bad: #ff7a7a;
  --font-display: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
body { -webkit-tap-highlight-color: transparent; }
.app { max-width: 520px; margin: 0 auto; padding: 14px 16px 96px; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 { font-family: var(--font-display); font-size: 18px; letter-spacing: .01em; margin: 0; font-weight: 800; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; }
