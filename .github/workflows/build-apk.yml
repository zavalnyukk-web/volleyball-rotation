name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add app icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('icon-512.png').convert('RGBA')
          for name, s in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = 'android/app/src/main/res/mipmap-' + name
              os.makedirs(d, exist_ok=True)
              img = src.resize((s, s), Image.LANCZOS)
              img.save(d + '/ic_launcher.png')
              mask = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, s * 4 - 1, s * 4 - 1], fill=255)
              mask = mask.resize((s, s), Image.LANCZOS)
              out = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              out.paste(img, (0, 0), mask)
              out.save(d + '/ic_launcher_round.png')
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk volleyball-rotation.apk

      - uses: actions/upload-artifact@v4
        with:
          name: volleyball-rotation-apk
          path: volleyball-rotation.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.${{ github.run_number }}" volleyball-rotation.apk \
            --title "Волейбол Розстановка v1.${{ github.run_number }}" \
            --notes "Розробник: zavalnyuk. Завантаж volleyball-rotation.apk на телефон і встанови."
