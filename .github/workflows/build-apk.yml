name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add app icons
        run: |
          pip install pillow numpy
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import numpy as np
          import os
          res = 'android/app/src/main/res/'
          src = Image.open('icon-1024.png' if os.path.exists('icon-1024.png') else 'icon-512.png').convert('RGB')
          # adaptive layers on a 1024 canvas (= 108dp): blurred background + artwork on top
          S = 1024
          z = int(S * 1.4)
          bg = src.resize((z, z), Image.LANCZOS).crop(((z - S) // 2, (z - S) // 2, (z + S) // 2, (z + S) // 2))
          bg = bg.filter(ImageFilter.GaussianBlur(S * 0.04))
          fs = int(S * 0.70)
          art = src.resize((fs, fs), Image.LANCZOS).convert('RGBA')
          yy, xx = np.mgrid[0:fs, 0:fs]
          dist = np.minimum(np.minimum(xx, fs - 1 - xx), np.minimum(yy, fs - 1 - yy))
          art.putalpha(Image.fromarray((np.clip(dist / (fs * 0.03), 0, 1) * 255).astype('uint8')))
          fg = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          fg.paste(art, ((S - fs) // 2, (S - fs) // 2), art)
          for name, k in [('mdpi', 1), ('hdpi', 1.5), ('xhdpi', 2), ('xxhdpi', 3), ('xxxhdpi', 4)]:
              d = res + 'mipmap-' + name
              os.makedirs(d, exist_ok=True)
              s = int(48 * k)
              img = src.resize((s, s), Image.LANCZOS)
              img.save(d + '/ic_launcher.png')
              mask = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, s * 4 - 1, s * 4 - 1], fill=255)
              mask = mask.resize((s, s), Image.LANCZOS)
              out = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              out.paste(img.convert('RGBA'), (0, 0), mask)
              out.save(d + '/ic_launcher_round.png')
              a = int(108 * k)
              fg.resize((a, a), Image.LANCZOS).save(d + '/ic_launcher_fg.png')
              bg.resize((a, a), Image.LANCZOS).save(d + '/ic_launcher_bg.png')
          os.makedirs(res + 'mipmap-anydpi-v26', exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@mipmap/ic_launcher_bg"/>\n'
                 '    <foreground android:drawable="@mipmap/ic_launcher_fg"/>\n'
                 '</adaptive-icon>\n')
          for f in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(res + 'mipmap-anydpi-v26/' + f, 'w').write(xml)
          PY

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk volleyball-rotation.apk

      - uses: actions/upload-artifact@v4
        with:
          name: volleyball-rotation-apk
          path: volleyball-rotation.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.${{ github.run_number }}" volleyball-rotation.apk \
            --title "Волейбол Розстановка v1.${{ github.run_number }}" \
            --notes "Розробник: zavalnyuk. Завантаж volleyball-rotation.apk на телефон і встанови."
